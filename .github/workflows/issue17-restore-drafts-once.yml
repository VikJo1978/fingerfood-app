name: Issue 17 restore drafts once

on:
  push:
    branches:
      - issue-17-restore-saved-drafts

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-17-restore-saved-drafts
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply restore patch
        run: |
          python scripts_issue17_restore_patch.py
          python scripts_issue17_update_guard_test.py
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Format changed frontend files
        working-directory: frontend
        run: |
          npx biome format --write \
            src/services/api.ts \
            src/utils/draftPersistence.ts \
            src/pages/HomePage.tsx \
            src/components/drafts/SavedDraftBrowser.tsx \
            src/utils/__tests__/draftPersistence.test.ts \
            src/utils/__tests__/savedDraftRestore.test.ts \
            src/pages/__tests__/HomePage.savedDraftRestore.test.tsx
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "Issue #17: restore saved configurator drafts"
            git push origin HEAD:issue-17-restore-saved-drafts
          fi
