name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cross-repository contract: pin to the exact merged Core commit that
      # provides both recommendation-demand and recommendation-capacity for
      # issue #151/#162. Never use a moving branch here; bump deliberately
      # when the approved Core contract changes.
      - name: Checkout Core contract (VikJo1978/silberloeffel-catering)
        uses: actions/checkout@v7
        with:
          repository: VikJo1978/silberloeffel-catering
          ref: 0f58774677a036b746f884c8b28b8bc6c7a78047
          path: core-contract
      - name: Place Core checkout at the path expected by the cross-repository E2E tests
        run: |
          mkdir -p "$HOME/projects"
          ln -s "$GITHUB_WORKSPACE/core-contract" "$HOME/projects/silberlöffelcatering"
          test -d "$HOME/projects/silberlöffelcatering/src/catering_system"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Type-check backend
        working-directory: backend
        run: mypy app
      - name: Test backend
        working-directory: backend
        run: |
          set -o pipefail
          pytest -q -rs | tee /tmp/pytest-output.txt
          # The only skip marker anywhere in this suite is
          # test_prepare_offer_e2e.py's Core-checkout guard — any SKIPPED
          # line here means the cross-repository contract tests didn't
          # actually run, which must fail CI, not pass quietly.
          if grep -q '^SKIPPED' /tmp/pytest-output.txt; then
            echo "one or more tests were skipped — cross-repository contract tests must not skip in CI:" >&2
            grep '^SKIPPED' /tmp/pytest-output.txt >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify production bundle boundary
        working-directory: frontend
        run: |
          forbidden_bundle_pattern='FINGERFOOD_API_TOKEN|CORE_OFFICE_API_URL|CORE_OFFICE_API_TOKEN|CORE_OFFICE_PANEL_URL|Authorization.{0,80}Bearer|100\.109\.6\.74|localhost'
          if ! grep -Eq "$forbidden_bundle_pattern" \
            <<< 'Authorization: Bearer bundle-audit-sentinel'; then
            echo "bundle boundary sentinel was not detected" >&2
            exit 1
          fi
          if grep -RInE "$forbidden_bundle_pattern" dist; then
            echo "server-only configuration found in production bundle" >&2
            exit 1
          fi
