name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Type-check backend
        working-directory: backend
        run: mypy app
      - name: Test backend
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify production bundle boundary
        working-directory: frontend
        run: |
          forbidden_bundle_pattern='FINGERFOOD_API_TOKEN|CORE_OFFICE_API_URL|CORE_OFFICE_API_TOKEN|CORE_OFFICE_PANEL_URL|Authorization.{0,80}Bearer|100\.109\.6\.74|localhost'
          if ! grep -Eq "$forbidden_bundle_pattern" \
            <<< 'Authorization: Bearer bundle-audit-sentinel'; then
            echo "bundle boundary sentinel was not detected" >&2
            exit 1
          fi
          if grep -RInE "$forbidden_bundle_pattern" dist; then
            echo "server-only configuration found in production bundle" >&2
            exit 1
          fi
