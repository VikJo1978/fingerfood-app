name: Minimize issue 171 frontend diff once

on:
  push:
    branches:
      - issue-171-return-logistics-configurator
    paths:
      - .github/workflows/issue171-minimize-frontend-diff-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-171-return-logistics-configurator
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reapply only semantic frontend changes
        run: |
          git fetch origin main
          files=(
            frontend/src/types/index.ts
            frontend/src/utils/offerSnapshotRequest.ts
            frontend/src/utils/draftPersistence.ts
            frontend/src/utils/pricing.ts
            frontend/src/components/summary/ChargeConfiguratorModal.tsx
            frontend/src/components/summary/OfferSummary.tsx
            frontend/src/components/summary/OfferPreview.tsx
          )
          git diff -w origin/main...HEAD -- "${files[@]}" > /tmp/issue171-semantic.patch
          test -s /tmp/issue171-semantic.patch
          git checkout origin/main -- "${files[@]}"
          git apply --ignore-space-change --ignore-whitespace /tmp/issue171-semantic.patch

      - name: Update pre-171 frontend expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/src/utils/__tests__/offerSnapshotRequest.test.ts")
          text = path.read_text(encoding="utf-8")

          def add_return_default(text: str, mode: str, cents: int) -> str:
              pattern = re.compile(
                  rf'(?P<block>(?P<indent>^[ \t]+)buffet: \{{\n'
                  rf'[ \t]+base_mode: "{mode}",\n'
                  rf'[ \t]+pauschale_per_person_cents: {cents},\n'
                  rf'(?P=indent)\}},)(?P<tail>\n[ \t]+\}}\);)',
                  re.MULTILINE,
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise RuntimeError(
                      f"unexpected charges expectation count for {mode}/{cents}: {len(matches)}"
                  )
              match = matches[0]
              indent = match.group("indent")
              child = indent + "  "
              insertion = (
                  f'{match.group("block")}\n'
                  f'{indent}return_logistics: {{\n'
                  f'{child}mode: "NEXT_WORKING_DAY",\n'
                  f'{child}pickup_window_text: null,\n'
                  f'{child}same_day_fee_cents: 0,\n'
                  f'{indent}}},'
                  f'{match.group("tail")}'
              )
              return text[: match.start()] + insertion + text[match.end() :]

          text = add_return_default(text, "NONE", 50)
          text = add_return_default(text, "PAUSCHALE", 75)
          path.write_text(text, encoding="utf-8")

          path = Path("frontend/src/utils/__tests__/draftPersistence.test.ts")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'^(?P<indent>[ \t]*)expect\(restored\?\.chargesDefinition\)'
              r'\.toEqual\(draft\.chargesDefinition\);$',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise RuntimeError(
                  f"unexpected draft persistence assertion count: {len(matches)}"
              )
          match = matches[0]
          indent = match.group("indent")
          child = indent + "  "
          grandchild = child + "  "
          replacement = (
              f'{indent}expect(restored?.chargesDefinition).toEqual({{\n'
              f'{child}...draft.chargesDefinition,\n'
              f'{child}returnLogistics: {{\n'
              f'{grandchild}mode: "NEXT_WORKING_DAY",\n'
              f'{grandchild}pickupWindowText: null,\n'
              f'{grandchild}sameDayFeeCents: 0,\n'
              f'{child}}},\n'
              f'{indent}}});'
          )
          path.write_text(
              text[: match.start()] + replacement + text[match.end() :],
              encoding="utf-8",
          )
          PY

      - name: Validate frontend after diff cleanup
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit minimized frontend diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/types/index.ts \
            frontend/src/utils/offerSnapshotRequest.ts \
            frontend/src/utils/draftPersistence.ts \
            frontend/src/utils/pricing.ts \
            frontend/src/components/summary/ChargeConfiguratorModal.tsx \
            frontend/src/components/summary/OfferSummary.tsx \
            frontend/src/components/summary/OfferPreview.tsx \
            frontend/src/utils/__tests__/offerSnapshotRequest.test.ts \
            frontend/src/utils/__tests__/draftPersistence.test.ts
          git commit -m "Issue #171: minimize frontend diff"
          git push origin HEAD:issue-171-return-logistics-configurator
