name: Issue 175 Configurator timing once

on:
  push:
    branches:
      - issue-175-configurator-canonical-timing

permissions:
  contents: write

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Checkout Core V3 contract
        uses: actions/checkout@v7
        with:
          repository: VikJo1978/silberloeffel-catering
          ref: 834603c4d1d64a36012cd438cca466a95a50d69b
          path: core-contract

      - name: Place Core checkout at cross-repository test path
        run: |
          mkdir -p "$HOME/projects"
          ln -s "$GITHUB_WORKSPACE/core-contract" "$HOME/projects/silberlöffelcatering"
          test -d "$HOME/projects/silberlöffelcatering/src/catering_system"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Diagnose return-logistics anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("frontend/src/components/summary/ChargeConfiguratorModal.tsx").read_text()
          marker = "pickupWindowText:"
          idx = text.index(marker)
          print(repr(text[idx-140:idx+260]))
          PY

      - name: Apply canonical timing patch
        run: python scripts_issue175_configurator_timing_patch.py

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Lint backend
        working-directory: backend
        run: ruff check app tests

      - name: Type-check backend
        working-directory: backend
        run: mypy app

      - name: Test backend
        working-directory: backend
        run: |
          set -o pipefail
          pytest -q -rs | tee /tmp/pytest-output.txt
          if grep -q '^SKIPPED' /tmp/pytest-output.txt; then
            echo "one or more tests were skipped — cross-repository contract tests must not skip in CI:" >&2
            grep '^SKIPPED' /tmp/pytest-output.txt >&2
            exit 1
          fi

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify production bundle boundary
        working-directory: frontend
        run: |
          forbidden_bundle_pattern='FINGERFOOD_API_TOKEN|CORE_OFFICE_API_URL|CORE_OFFICE_API_TOKEN|CORE_OFFICE_PANEL_URL|Authorization.{0,80}Bearer|100\.109\.6\.74|localhost'
          if ! grep -Eq "$forbidden_bundle_pattern" <<< 'Authorization: Bearer bundle-audit-sentinel'; then
            echo "bundle boundary sentinel was not detected" >&2
            exit 1
          fi
          if grep -RInE "$forbidden_bundle_pattern" dist; then
            echo "server-only configuration found in production bundle" >&2
            exit 1
          fi

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+VikJo1978@users.noreply.github.com"
          git add backend frontend .github/workflows/ci.yml docs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Issue #175: produce canonical logistics timing"
          git push
