name: Apply issue 171 configurator return slice once

on:
  push:
    branches:
      - issue-171-return-logistics-configurator
    paths:
      - backend/scripts/issue171_apply_configurator_return.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-171-return-logistics-configurator

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply return logistics patch
        run: python backend/scripts/issue171_apply_configurator_return.py

      - name: Install backend tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Format and validate backend slice
        working-directory: backend
        run: |
          ruff format \
            app/models/charges_definition.py \
            app/services/offer_snapshot_service.py \
            tests/test_offer_snapshot_charges.py
          ruff check \
            app/models/charges_definition.py \
            app/services/offer_snapshot_service.py \
            tests/test_offer_snapshot_charges.py
          mypy app
          pytest -q tests/test_offer_snapshot_charges.py

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Format and validate frontend slice
        working-directory: frontend
        run: |
          npx biome check --write \
            src/types/index.ts \
            src/utils/offerSnapshotRequest.ts \
            src/utils/draftPersistence.ts \
            src/utils/pricing.ts \
            src/components/summary/ChargeConfiguratorModal.tsx \
            src/components/summary/OfferSummary.tsx \
            src/components/summary/OfferPreview.tsx \
            src/utils/__tests__/issue171ReturnLogistics.test.ts \
            src/components/summary/__tests__/ChargeConfiguratorReturnLogistics.test.tsx
          npm run lint
          npm run typecheck
          npm test -- \
            src/utils/__tests__/issue171ReturnLogistics.test.ts \
            src/components/summary/__tests__/ChargeConfiguratorReturnLogistics.test.tsx
          npm run build

      - name: Commit tested product slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/models/charges_definition.py \
            backend/app/services/offer_snapshot_service.py \
            backend/tests/test_offer_snapshot_charges.py \
            frontend/src/types/index.ts \
            frontend/src/utils/offerSnapshotRequest.ts \
            frontend/src/utils/draftPersistence.ts \
            frontend/src/utils/pricing.ts \
            frontend/src/components/summary/ChargeConfiguratorModal.tsx \
            frontend/src/components/summary/OfferSummary.tsx \
            frontend/src/components/summary/OfferPreview.tsx \
            frontend/src/utils/__tests__/issue171ReturnLogistics.test.ts \
            frontend/src/components/summary/__tests__/ChargeConfiguratorReturnLogistics.test.tsx
          git commit -m "Issue #171: add configurable return logistics"
          git push origin HEAD:issue-171-return-logistics-configurator
